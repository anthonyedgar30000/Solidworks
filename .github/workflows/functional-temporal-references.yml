name: Functional-temporal references

on:
  pull_request:
    paths:
      - "agent-registry/reasoning/functional_temporal.py"
      - "agent-registry/reasoning/reference_cases/*.functional-temporal.v1.json"
      - "agent-registry/reasoning/test_v43_prism_reference.py"
      - "agent-registry/reasoning/test_ixor_function_first_reference.py"
      - "agent-registry/reasoning/test_ixor_function_first_reference.py"
      - "agent-registry/workers/CadGrounded.SolidWorksWorker/Verify-ClassifyContact-V43-Prism-GuideRails.ps1"
      - ".github/workflows/functional-temporal-references.yml"
  push:
    branches: [main]
    paths:
      - "agent-registry/reasoning/functional_temporal.py"
      - "agent-registry/reasoning/reference_cases/*.functional-temporal.v1.json"
      - "agent-registry/reasoning/test_v43_prism_reference.py"
      - "agent-registry/workers/CadGrounded.SolidWorksWorker/Verify-ClassifyContact-V43-Prism-GuideRails.ps1"
      - ".github/workflows/functional-temporal-references.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v42 and v43 reference architectures
        working-directory: agent-registry/reasoning
        run: |
          python3 functional_temporal.py reference_cases/v42_capture_and_rotation.functional-temporal.v1.json --summary
          python3 functional_temporal.py reference_cases/v43_prism_capture_and_rotation.functional-temporal.v1.json --summary
          python3 functional_temporal.py reference_cases/ixor_function_first_bottle_labeler.functional-temporal.v1.json --summary
          python3 -m unittest -v test_v43_prism_reference.py test_ixor_function_first_reference.py
